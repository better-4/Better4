name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify tag is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "'${{ github.ref_name }}' does not point to a commit on main. Releases may only be cut from main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build export image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f docker/Dockerfile --target export -o build/out . \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/cache \
            --cache-to type=registry,ref=ghcr.io/${{ github.repository }}/cache,mode=max

      - name: Package artifacts
        working-directory: build/out
        run: zip -r "${GITHUB_WORKSPACE}/Better4-v${{ github.ref_name }}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Better4 v${{ github.ref_name }}"
          files: Better4-v${{ github.ref_name }}.zip
          generate_release_notes: true
